<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Primary Theme Gradient -->
    <linearGradient id="hkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#060914" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ambientGlow)" />

  <!-- Monogram Group -->
  <g fill="url(#hkGrad)">
    <!-- Letter H -->
    <!-- Left vertical bar -->
    <rect x="11" y="16" width="6" height="32" rx="2" />
    <!-- Right vertical bar -->
    <rect x="26" y="16" width="6" height="32" rx="2" />
    <!-- Horizontal crossbar -->
    <rect x="14" y="29" width="15" height="6" rx="1.5" />

    <!-- Letter K -->
    <!-- Vertical spine -->
    <rect x="36" y="16" width="6" height="32" rx="2" fill="#ffffff" />
    <!-- Upper diagonal leg -->
    <path d="M38 31 L48.5 17.5 C49.2 16.6 50.5 16.6 51.3 17.3 L52.2 18.2 C52.9 18.9 52.8 20.1 52.0 20.9 L43 32 Z" fill="#ffffff" />
    <!-- Lower diagonal leg -->
    <path d="M41.5 28.5 L51.8 45.0 C52.5 46.1 52.1 47.5 51.0 48.0 L50.0 48.4 C49.0 48.8 47.8 48.4 47.2 47.4 L38 32.5 Z" fill="#00e5ff" />
  </g>

  <!-- Live Status Dot (Online/Active) -->
  <circle cx="53" cy="11" r="4" fill="#10b981" />
  <circle cx="53" cy="11" r="5.5" stroke="#10b981" stroke-width="1.2" opacity="0.5" />
</svg>